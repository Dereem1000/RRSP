<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Windows protected your PC with More info">
  <defs>
    <linearGradient id="winBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" rx="12" fill="url(#winBg)"/>
  <rect x="70" y="28" width="260" height="164" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="200" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#0f172a" font-weight="700">Windows protected your PC</text>
  <text x="200" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">Microsoft Defender SmartScreen prevented</text>
  <text x="200" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">an unrecognized app from starting.</text>
  <rect x="110" y="108" width="180" height="28" rx="4" fill="#e2e8f0"/>
  <text x="200" y="126" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">POSSystem-Setup.exe</text>
  <text x="200" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">Publisher: Unknown publisher</text>
  <rect x="118" y="156" width="72" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="154" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">Don&apos;t run</text>
  <rect x="210" y="154" width="82" height="28" rx="4" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="251" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#2563eb" font-weight="700">More info</text>
  <path d="M251 182 L251 198 L267 190 Z" fill="#2563eb"/>
  <text x="200" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#fde68a" font-weight="700">Step 2 - Click More info</text>
</svg>
